[project]
name = "vision-demo"
version = "0.1.0"
description = "Isolated RapidEye security demo dashboard (ingest + GPU inference + web UI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# Full pinned ML/GPU stack lives in requirements-lock.txt — install via
# `make install`. These are looser bounds for `pip install -e ".[facial]"`
# on platforms make install doesn't cover (e.g. macOS dev, no GPU).
facial = [
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.19.0; platform_system != 'Darwin'",
    "onnxruntime>=1.19.0; platform_system == 'Darwin'",
    "lapx>=0.9.0",
    "ultralytics>=8.3.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pynvml>=11.5.0",
]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
face-recognition = "server.inference.face_recognition:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
]
